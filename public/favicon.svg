<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="4" />

  <!-- Soft Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" />

  <!-- Shield / Emblem Container -->
  <g filter="url(#shadow)">
    <!-- Central Hexagonal / Squircle Emblem -->
    <rect x="106" y="106" width="300" height="300" rx="72" fill="url(#brandGrad)" />
    
    <!-- Inner Dark Accent Shield -->
    <rect x="122" y="122" width="268" height="268" rx="58" fill="#090A0F" fill-opacity="0.88" />
    
    <!-- Currency / Growth Emblem ($ / R$) in Gold/White/Emerald -->
    <!-- Vertical Bar -->
    <rect x="242" y="160" width="28" height="192" rx="14" fill="#34D399" />
    
    <!-- Top Arc of S -->
    <path d="M 320 220 C 320 185 290 175 256 175 C 215 175 188 195 188 225 C 188 275 324 250 324 295 C 324 330 295 345 256 345 C 210 345 184 322 184 290" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Trend Arrow Growth Accent -->
    <path d="M 330 170 L 375 170 L 375 215" fill="none" stroke="#34D399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 305 240 L 372 173" fill="none" stroke="#34D399" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
